<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Smart CRM</title>
<style>
body { background: linear-gradient(135deg,#f2994a,#f2c94c); font-family:'Segoe UI',sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.form-container { background:white; padding:30px 40px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2); width:350px; }
h2 { text-align:center; color:#f2994a; margin-bottom:25px; }
.form-group { margin-bottom:18px; }
.form-group input { width:100%; padding:12px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
.btn { width:100%; padding:12px; background-color:#f2994a; color:white; border:none; border-radius:6px; font-size:16px; font-weight:600; cursor:pointer; transition:0.3s; }
.btn:hover { background-color:#eb8a3c; }
</style>
</head>
<body>
<div class="form-container">
<h2>Admin Login</h2>
<form method="POST" action="admin_login.php">
  <div class="form-group">
    <input type="text" name="username" placeholder="Admin Username" required>
  </div>
  <div class="form-group">
    <input type="password" name="password" placeholder="Password" required>
  </div>
  <button type="submit" class="btn">Login</button>
</form>
</div>
</body>
</html>
