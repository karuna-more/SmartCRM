<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart CRM Registration</title>
<style>
body {
    background: linear-gradient(135deg,#667eea,#764ba2);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.form-container {
    background: white;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    width: 380px;
}
h2 {
    text-align: center;
    color: #764ba2;
    margin-bottom: 25px;
}
.form-group {
    margin-bottom: 18px;
}
.form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}
.btn {
    width: 100%;
    padding: 12px;
    background-color: #764ba2;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}
.btn:hover { background-color: #667eea; }
p {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}
p a {
    color: #764ba2;
    text-decoration: none;
}
p a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="form-container">
<h2>Create Smart CRM Account</h2>
<form method="POST" action="registration.php">
    <div class="form-group">
        <input type="text" name="fullname" placeholder="Enter your full name"
               required pattern="[A-Za-z\s]+" title="Full name should only contain letters and spaces">
    </div>
    <div class="form-group">
        <input type="text" name="username" placeholder="Enter your username"
               required pattern="[A-Za-z0-9]+" title="Username can contain letters and numbers only">
    </div>
    <div class="form-group">
        <input type="email" name="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
        <input type="text" name="phone" placeholder="Enter your phone number"
               required pattern="[0-9]{10}" title="Enter a valid 10-digit number">
    </div>
    <div class="form-group">
        <input type="password" name="password" placeholder="Create a password" required minlength="5">
    </div>
    <div class="form-group">
        <input type="password" name="confirm_password" placeholder="Confirm your password" required minlength="5">
    </div>
    <button type="submit" class="btn">Register</button>
</form>
<p>Already have an account? <a href="login.html">Login here</a></p>
</div>
</body>
</html>
